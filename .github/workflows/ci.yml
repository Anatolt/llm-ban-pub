name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PHP SQLite
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: Unit and HTTP integration tests
        run: python3 -m unittest discover -s tests -v
      - name: PHP lint
        run: find public -name '*.php' -exec php -l {} \;
      - name: Publication hygiene
        run: python3 scripts/check_public.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify deployment without paid APIs
        run: python3 scripts/smoke_compose.py
